[package]
name = "agent-storm"
version = "0.0.2"
edition = "2024"
description = "Multi-pane AI coding assistant launcher"
license = "MIT"
repository = "https://github.com/electrovir/agent-storm"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.0"
tui-term = "0.3.2"
vt100 = "0.16.2"
portable-pty = "0.9.0"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
