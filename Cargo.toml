[package]
name = "agent-storm"
version = "1.9.9"
edition = "2024"
description = "Multi-pane AI coding assistant launcher"
license = "MIT"
repository = "https://github.com/electrovir/agent-storm"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
libc = "0.2"
